[package]
name = "ove-project"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Project persistence for the open-video-engine (ADR-008/ADR-016, PROJECT_FORMAT_SPEC): manifest + append-only command log + snapshot compaction. Core crate: NO libav linkage ever."

[dependencies]
ove-time = { path = "../ove-time" }
ove-media = { path = "../ove-media" }
ove-timeline = { path = "../ove-timeline" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# Android leg (waves 10–12): the C blake3 build needs the NDK clang; the
# `pure` implementation is the same algorithm (identical digests, tested
# upstream) and needs no C toolchain — scoped to Android targets only.
[target.'cfg(target_os = "android")'.dependencies]
blake3 = { version = "1.8", features = ["pure"] }
