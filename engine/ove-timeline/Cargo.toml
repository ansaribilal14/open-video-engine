[package]
name = "ove-timeline"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Per-track clip sequences with exact rational time, edit verbs with exact inverses (E-012 / ADR-006/007/009/011)"

[dependencies]
ove-time = { path = "../ove-time" }

[[bin]]
name = "e012_bench"
path = "src/bin/e012_bench.rs"

[profile.release]
opt-level = 3
