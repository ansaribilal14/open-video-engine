[package]
name = "ove-media"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Libav-free media data model for the open-video-engine: asset identity (content hash), probe types (DECODER_SPEC), FrameEnvelope (FRAME_CONTRACT), frame pool"

[dependencies]
ove-time = { path = "../ove-time", features = ["serde"] }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
