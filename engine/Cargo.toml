[workspace]
resolver = "2"
members = ["ove-time", "ove-timeline", "ove-media", "ove-decode", "ove-render", "ove-encode", "ove-project", "ove-engine", "ove-cli"]
# ove-project (wave 4) + ove-engine/ove-cli (wave 5) are the last members
# of the BUILD_PLAN crate set.

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["open-video-engine contributors"]

[profile.release]
debug = true          # perf benches need symbols; correctness unaffected
