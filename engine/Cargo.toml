[workspace]
resolver = "2"
members = ["ove-time", "ove-timeline", "ove-media", "ove-decode", "ove-render", "ove-encode", "ove-project", "ove-engine", "ove-cli", "ove-conformance", "ove-mcp"]
# ove-project (wave 4) + ove-engine/ove-cli (wave 5) are the last members
# of the BUILD_PLAN crate set; ove-conformance (waves 10-12) is the
# cross-platform conformance runner (CROSS_PLATFORM_CONFORMANCE_PLAN §3);
# ove-mcp (wave 15) is the AI-client leg: MCP tools over stdio JSON-RPC.

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["open-video-engine contributors"]

[profile.release]
debug = true          # perf benches need symbols; correctness unaffected
