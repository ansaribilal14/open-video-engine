[package]
name = "ove-render"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["open-video-engine contributors"]
description = "Software reference renderer: deterministic RenderPlan compile + CPU RGBA execution (RENDER_GRAPH_SPEC; ADR-014 — software-first, GPU is only a backend)"

[features]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
ove-time = { path = "../ove-time" }
ove-timeline = { path = "../ove-timeline" }
ove-media = { path = "../ove-media" }
blake3 = "1.8"
wgpu = { version = "25.0", optional = true }
pollster = { version = "0.4", optional = true }

# Android leg (waves 10–12): the C blake3 build needs the NDK clang; the
# `pure` implementation is the same algorithm (identical digests, tested
# upstream) and needs no C toolchain — scoped to Android targets only.
[target.'cfg(target_os = "android")'.dependencies]
blake3 = { version = "1.8", features = ["pure"] }
