[package]
name = "e006a_ipc_serialization"
version = "0.1.0"
edition = "2021"
description = "E-006a re-run: native-side IPC serialization costs (serde_json vs bincode vs postcard) for engine traffic shapes"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
postcard = { version = "1", features = ["alloc"] }

[profile.release]
debug = false
