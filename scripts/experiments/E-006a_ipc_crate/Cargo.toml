[package]
name = "e006a_ipc_serialization"
version = "0.1.0"
edition = "2021"
description = "E-006a re-run: native-side IPC serialization costs (serde_json vs bincode vs postcard) for engine traffic shapes"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "e006a"
path = "src/E-006a_ipc_serialization.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
postcard = { version = "1", features = ["use-std"] }
